services:
    nginx:
        build:
            context: ./
            dockerfile: docker/nginx.docker
        volumes:
            - ./:/var/www
        ports:
            - "8082:80"
        depends_on:
            - php-fpm

    php-fpm:
        build:
            context: ./
            dockerfile: docker/php-fpm.docker
        volumes:
            - ./:/var/www
        depends_on:
            - mysql
        environment:
            - "DB_PORT=3306"
            - "DB_HOST=mysql"

    php-cli:
        build:
          context: ./
          dockerfile: docker/php-cli.docker
        volumes:
          - ./:/var/www
        depends_on:
          - mysql
        environment:
          - "DB_PORT=3306"
          - "DB_HOST=mysql"
        tty: true

    mysql:
        image: mysql:8.0
        volumes:
            - ./storage/docker/mysql:/var/lib/mysql
        environment:
            - "MYSQL_ROOT_PASSWORD=123"
            - "MYSQL_USER=worklogger"
            - "MYSQL_PASSWORD=123"
            - "MYSQL_DATABASE=worklogger"
        ports:
            - "33061:3306"
